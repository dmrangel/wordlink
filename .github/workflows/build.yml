name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Node runs the shared engine's JS tests (:core) and builds the web app.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Optional release signing: add KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD as repository secrets. Without them the
      # release APK is signed with the debug key (still installable).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :core:allTests :core:jsProductionLibraryDistribution testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Rename APKs
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "wordlink-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "wordlink-$version-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: wordlink-*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/screenshots/
            core/build/reports/

  # Publishes web/ to GitHub Pages. Needs Settings > Pages > Source: GitHub Actions.
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - uses: softprops/action-gh-release@v3
        with:
          files: wordlink-*.apk
          generate_release_notes: true
